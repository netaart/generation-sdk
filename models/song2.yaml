schema: neta.generation.model.v1
model: song2
title: Song 2
category: audio
description: Generates a full song with vocals from a style description and lyrics, optionally following an ABC notation score. The style description and lyrics are required and capped at 2000 characters each; the score is optional and capped at 64000. Generation is asynchronous and can take several minutes.
adapter:
  type: newapi.audioGenerations
content:
  input:
    - type: text
      required: true
      min: 2
      max: 3
      roles:
        - prompt
        - lyrics
        - abc
      roleRequired: true
      description: Two or three text blocks. Use meta.role prompt for the style description and meta.role lyrics for the lyrics to sing, plus an optional meta.role abc block with an ABC notation score for the song to follow.
parameters:
  abc_mode:
    type: string
    optional: true
    enum: [full, melody, "off"]
    description: How the song uses the ABC score. full follows a score with chords, melody follows only the melody, off plans no score. A score with chord marks is rejected in melody mode when the task runs; remove the chords or use full. Omitted, a given score is read for chord marks to pick full or melody, and without a score full is used. off cannot be combined with an abc block or return_abc true.
  seed:
    type: integer
    optional: true
    min: 0
    max: 9007199254740991
    description: Random seed from 0 to 9007199254740991. Omit it for a different random seed on every request.
  cfg_scale:
    type: number
    optional: true
    min: 0
    max: 20
    description: Guidance strength from 0 to 20. Omit it for the model default.
  return_abc:
    type: boolean
    optional: true
    description: Return the ABC score the song used as a text block with meta.role abc after the audio block. Omit it to receive the song only.
examples:
  - title: Song from style and lyrics
    request:
      model: song2
      content:
        - type: text
          text: bright J-pop, female vocal, piano
          meta:
            role: prompt
        - type: text
          text: |-
            [verse]
            la la la
          meta:
            role: lyrics
  - title: Song that returns its score
    request:
      model: song2
      content:
        - type: text
          text: bright J-pop, female vocal, piano
          meta:
            role: prompt
        - type: text
          text: |-
            [verse]
            la la la
          meta:
            role: lyrics
      parameters:
        seed: 7
        return_abc: true
