schema: neta.generation.model.v1
model: seedance-2-5
title: Seedance 2.5
category: video
description: Seedance 2.5 video generation with text, image, video, and audio inputs. Supports 480p to 1080p. Priced above Seedance 2.0 on BytePlus list USD; 4K is not offered.
pricing:
  unit: 1m_tokens
  min: 6.4
  max: 11.7
  note: BytePlus list USD; varies by resolution and video input
adapter:
  type: ark.videoGenerations
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Video prompt.
    - type: image
      required: false
      max: 30
      sources:
        - url
      roles:
        - first_frame
        - last_frame
        - reference_image
      media:
        formats: [jpeg, png, webp, bmp, tiff, gif, heic, heif]
        maxBytes: 31457280 # 30 MB
        width: { min: 300, max: 6000 }
        height: { min: 300, max: 6000 }
        aspectRatio: { min: 0.4, max: 2.5 }
      description: Optional public URL image input. Use meta.role as first_frame, last_frame, or reference_image; a last_frame needs a first_frame. Each image must be jpeg, png, webp, bmp, tiff, gif, heic, or heif, under 30 MB, with width and height between 300 and 6000 px and an aspect ratio (width/height) between 0.4 and 2.5.
    - type: video
      required: false
      max: 10
      sources:
        - url
      roles:
        - reference_video
      roleRequired: true
      media:
        formats: [mp4, mov]
        maxBytes: 209715200 # 200 MB
        width: { min: 300, max: 6000 }
        height: { min: 300, max: 6000 }
        aspectRatio: { min: 0.4, max: 2.5 }
        pixels: { min: 407696, max: 8295044 }
        fps: { min: 23.8, max: 60 }
        duration: { min: 1.8, max: 30.2 }
        totalDuration: { max: 30.2 }
      description: Optional public URL reference video input. Use meta.role as reference_video. Not accepted with first_frame/last_frame. Each video must be mp4 or mov, at most 200 MB, 2–30 s long, and 24–60 fps, with width and height between 300 and 6000 px, an aspect ratio (width/height) between 0.4 and 2.5, and width × height between 407,696 and 8,295,044 pixels (854×480 passes, 640×480 does not); all videos together at most 30 s. Re-encode slow-motion or high-refresh recordings at a constant 24 or 30 fps first.
    - type: audio
      required: false
      max: 10
      sources:
        - url
      roles:
        - reference_audio
      roleRequired: true
      media:
        formats: [wav, mp3]
        maxBytes: 15728640 # 15 MB
        duration: { min: 1.8, max: 30.2 }
        totalDuration: { max: 30.2 }
      description: Optional public URL reference audio. Use meta.role reference_audio. Not accepted with first_frame/last_frame. Audio can be the only media input. Each clip must be wav or mp3, at most 15 MB, and 2–30 s long; all clips together at most 30 s.
parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 4
    max: 30
    values: [-1]
    description: Video duration in seconds, or -1 to let the model choose. When the prompt edits or extends the reference video, Seedance treats the task as video editing and requires -1.
  resolution:
    type: string
    optional: true
    default: 1080p
    enum: [480p, 720p, 1080p]
    description: Output video resolution.
  ratio:
    type: string
    optional: true
    default: "16:9"
    enum: ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9", adaptive]
    description: Output aspect ratio. Use adaptive to let the model choose. First/last-frame tasks and video editing require adaptive.
  seed:
    type: integer
    optional: true
    description: Random seed for reproducibility.
  camera_fixed:
    type: boolean
    optional: true
    default: false
    description: Fix camera position when supported.
  poll_interval:
    type: integer
    optional: true
    default: 1
    min: 1
    max: 30
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 900
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.
examples:
  - title: Text to video
    request:
      model: seedance-2-5
      content:
        - type: text
          text: a cat playing piano in a cozy jazz club, cinematic lighting, smooth camera movement
      parameters:
        duration: 5
        resolution: 1080p
        ratio: "16:9"
