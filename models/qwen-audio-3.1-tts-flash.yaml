schema: neta.generation.model.v1
model: qwen-audio-3.1-tts-flash
title: Qwen Audio 3.1 TTS Flash
description: "Modes: voice_prompt design OR one-reference clone, each with the optional instructions parameter for how the whole text is spoken. Text: >=15 Unicode code points. Not supported: speed, response_format, voice, stream, or a separate language parameter. Conflict: ask user; never combine/reinterpret. Dependency: clone prior generated audio."
adapter:
  type: openai.audioSpeech
content:
  input:
    - type: text
      required: true
      min: 1
      max: 1
      description: Exactly one non-empty text block to speak, with at least 15 Unicode code points.
    - type: audio
      required: false
      max: 1
      sources:
        - url
      description: "Clone: one URL; no voice_prompt. Dependency: use prior generated audio."
meta:
  fields:
    voice_prompt:
      type: string
      optional: true
      description: "Design: custom voice text; no reference audio."
parameters:
  instructions:
    type: string
    optional: true
    description: "Natural-language direction for how the whole text is spoken: tone, emotion, pace, dialect or role. Works with a designed and a cloned voice."
  seed:
    type: integer
    optional: true
    min: 0
    max: 65535
    description: Random seed, passed to the model.
examples:
  - title: Voice design
    request:
      model: qwen-audio-3.1-tts-flash
      content:
        - type: text
          text: 这是一段长度足够并且表达清晰自然的语音合成测试文本。
      meta:
        voice_prompt: 一位沉稳干练的男性播音员声音，吐字清晰有力
  - title: Voice clone
    request:
      model: qwen-audio-3.1-tts-flash
      content:
        - type: text
          text: 这是一段长度足够并且表达清晰自然的语音合成测试文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
  - title: Voice design with instructions
    request:
      model: qwen-audio-3.1-tts-flash
      content:
        - type: text
          text: 这是一段长度足够并且表达清晰自然的语音合成测试文本。
      meta:
        voice_prompt: 一位沉稳干练的男性播音员声音，吐字清晰有力
      parameters:
        instructions: 语速放慢，声音压低，带一点疲惫
